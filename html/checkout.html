<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán - ShopDirect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- Navbar Container -->
    <div id="navbar-container"></div>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <h1 class="text-2xl font-bold mb-6 flex items-center gap-2">
            <i class="fa-solid fa-credit-card text-indigo-600"></i> Xác nhận thanh toán
        </h1>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Form thông tin giao hàng -->
            <div class="lg:col-span-2 bg-white p-6 rounded-2xl shadow-sm border">
                <h2 class="text-lg font-bold mb-4 text-gray-700">Thông tin nhận hàng</h2>
                <form id="checkoutForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Họ và tên người nhận</label>
                        <input type="text" id="fullName" required class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">Số điện thoại</label>
                            <input type="tel" id="phone" required class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">Email</label>
                            <input type="email" id="email" required class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Địa chỉ giao hàng chi tiết</label>
                        <textarea id="address" rows="3" required class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
                    </div>

                    <h2 class="text-lg font-bold pt-4 mb-2 text-gray-700">Phương thức thanh toán</h2>
                    <div class="space-y-2">
                        <label class="flex items-center gap-3 p-3 border rounded-xl cursor-pointer hover:bg-gray-50">
                            <input type="radio" name="paymentMethod" value="COD" checked class="text-indigo-600">
                            <span>Thanh toán khi nhận hàng (COD)</span>
                        </label>
                        <label class="flex items-center gap-3 p-3 border rounded-xl cursor-pointer hover:bg-gray-50">
                            <input type="radio" name="paymentMethod" value="QR" class="text-indigo-600">
                            <span>Chuyển khoản mã QR Ngân hàng</span>
                        </label>
                    </div>

                    <button type="submit" class="w-full mt-6 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow-lg transition">
                        Hoàn tất đặt hàng
                    </button>
                </form>
            </div>

            <!-- Tóm tắt đơn hàng -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border h-fit">
                <h2 class="text-lg font-bold mb-4 text-gray-700">Đơn hàng của bạn</h2>
                <div id="checkoutItemsList" class="space-y-3 mb-6 max-h-60 overflow-y-auto pr-1">
                    <!-- Danh sách sản phẩm render bằng JS -->
                </div>
                <div class="border-t pt-4 space-y-2">
                    <div class="flex justify-between text-sm text-gray-600">
                        <span>Tạm tính</span>
                        <span id="subTotal">0 đ</span>
                    </div>
                    <div class="flex justify-between text-sm text-gray-600">
                        <span>Phí vận chuyển</span>
                        <span>0 đ</span>
                    </div>
                    <div class="flex justify-between font-extrabold text-lg text-gray-800 pt-2 border-t">
                        <span>Tổng cộng</span>
                        <span id="finalTotal" class="text-indigo-600">0 đ</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="../js/data-store.js"></script>
    <script src="../js/navbar.js"></script>
    <script src="../js/checkout.js"></script>
</body>
</html>
