<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - ShopDirect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">
    
    <div id="navbarContainer"></div>

    <main class="flex-1 container mx-auto px-4 py-6">
        
<div class="max-w-md mx-auto bg-white rounded-2xl shadow-sm border p-6">
    <h1 class="text-2xl font-bold text-gray-800 text-center mb-6">Đăng Nhập Tài Khoản</h1>
    <form onsubmit="handleLoginSubmit(event)" class="space-y-4">
        <div>
            <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Email *</label>
            <input type="email" id="loginEmail" required class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="admin@shopdirect.vn">
        </div>
        <div>
            <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Mật khẩu *</label>
            <input type="password" id="loginPass" required class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="******">
        </div>
        
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-lg transition shadow">
            Đăng nhập
        </button>
        <p class="text-xs text-center text-gray-500 mt-4">
            Chưa có tài khoản? <a href="register.html" class="text-indigo-600 font-bold hover:underline">Đăng ký ngay</a>
        </p>
    </form>
</div>

    </main>

    <div id="footerContainer"></div>

    <script src="../js/data-store.js"></script>
    <script src="../js/navbar.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
