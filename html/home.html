<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Chủ - ShopDirect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">
    
    <div id="navbarContainer"></div>

    <main class="flex-1 container mx-auto px-4 py-6">
        
<section class="mb-8">
    <div class="bg-gradient-to-r from-indigo-500 to-purple-600 rounded-2xl p-8 text-white shadow-lg flex flex-col md:flex-row items-center justify-between gap-6">
        <div>
            <h1 class="text-3xl md:text-4xl font-extrabold mb-2">Ưu Đãi Bán Hàng Trực Tiếp!</h1>
            <p class="text-indigo-100 mb-4">Sản phẩm chính hãng, giao hàng nhanh chóng, hỗ trợ thanh toán trực tiếp linh hoạt.</p>
            <a href="home.html" class="inline-block bg-white text-indigo-600 px-6 py-2.5 rounded-lg font-bold hover:bg-indigo-50 transition shadow">Khám phá ngay</a>
        </div>
        <div class="text-6xl text-indigo-200 hidden md:block">
            <i class="fa-solid fa-bag-shopping"></i>
        </div>
    </div>
</section>

<div class="flex justify-between items-center mb-6">
    <h2 id="pageTitle" class="text-2xl font-bold text-gray-800">Tất cả sản phẩm</h2>
    <span id="productCount" class="text-sm text-gray-500">Hiển thị 0 sản phẩm</span>
</div>

<div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
    <div class="bg-white rounded-lg shadow-md overflow-hidden hover:shadow-xl transition">
        <div class="bg-gray-200 h-40 flex items-center justify-center">
            <i class="fa-solid fa-image text-gray-400 text-3xl"></i>
        </div>
        <div class="p-4">
            <h3 class="font-bold text-gray-800 mb-2">Sản phẩm mẫu</h3>
            <p class="text-indigo-600 font-bold">100.000 ₫</p>
        </div>
    </div>
</div>

    </main>

    <div id="footerContainer"></div>

    <script src="../js/data-store.js"></script>
    <script src="../js/navbar.js"></script>
    <script src="../js/home.js"></script>
</body>
</html>
