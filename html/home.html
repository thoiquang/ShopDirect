<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Chủ - ShopDirect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="text-gray-800 flex flex-col min-h-screen">
    
    <div id="navbarContainer"></div>

    <main class="flex-1 container mx-auto px-4 py-6">
        
<section class="shop-hero mb-10 p-7 md:p-12">
    <div class="shop-hero-content flex flex-col md:flex-row items-start md:items-center justify-between gap-8">
        <div class="max-w-2xl">
            <p class="shop-kicker mb-3">ShopDirect / mua sắm trực tiếp</p>
            <h1 class="text-3xl md:text-5xl font-extrabold leading-tight text-white mb-4">Món đồ đúng gu.<br><span class="text-cyan-200">Giao đến đúng lúc.</span></h1>
            <p class="text-blue-100 max-w-xl mb-7">Khám phá sản phẩm được chọn lọc, giá minh bạch và trải nghiệm mua hàng gọn gàng cho mỗi ngày.</p>
            <a href="#productGrid" class="shop-action inline-flex items-center gap-2 px-5 py-3 rounded-lg font-bold transition"><span>Xem sản phẩm</span><i class="fa-solid fa-arrow-right"></i></a>
        </div>
        <div class="hidden md:flex w-40 h-40 rounded-full border border-white/20 bg-white/10 items-center justify-center text-white/80 text-6xl rotate-6">
            <i class="fa-solid fa-bag-shopping"></i>
        </div>
    </div>
</section>

<div class="flex justify-between items-center mb-6">
    <div><p class="shop-section-label mb-1">Bộ sưu tập hôm nay</p><h2 id="pageTitle" class="text-2xl font-bold text-gray-800">Tất cả sản phẩm</h2></div>
    <span id="productCount" class="text-sm text-gray-500">0 sản phẩm</span>
</div>

<div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
    <div class="bg-white rounded-lg shadow-md overflow-hidden hover:shadow-xl transition">
        <div class="bg-gray-200 h-40 flex items-center justify-center">
            <i class="fa-solid fa-image text-gray-400 text-3xl"></i>
        </div>
        <div class="p-4">
            <h3 class="font-bold text-gray-800 mb-2">Sản phẩm mẫu</h3>
            <p class="text-indigo-600 font-bold">100.000 ₫</p>
        </div>
    </div>
</div>

    </main>

    <div id="footerContainer"></div>

    <script src="../js/data-store.js"></script>
    <script src="../js/navbar.js"></script>
    <script src="../js/home.js"></script>
</body>
</html>
