<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ví ShopDirect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="text-gray-800 flex flex-col min-h-screen">
    <div id="navbarContainer"></div>
    <main class="flex-1 container mx-auto px-4 py-8">
        <div class="max-w-4xl mx-auto">
            <div class="flex flex-col md:flex-row md:items-end justify-between gap-4 mb-6">
                <div>
                    <p class="shop-section-label mb-1">Tài khoản ShopDirect</p>
                    <h1 class="text-3xl font-bold">Ví của tôi</h1>
                    <p class="text-sm text-gray-500 mt-2">Ví mô phỏng dùng trong website, không liên kết thanh toán thật.</p>
                </div>
                <div class="shop-wallet-balance shop-panel bg-white border rounded-2xl px-6 py-4 min-w-56">
                    <p class="text-xs text-gray-500 uppercase font-bold">Số dư mô phỏng</p>
                    <p id="walletBalance" class="text-2xl font-extrabold text-blue-700 mt-1">0 đ</p>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-5 gap-6">
                <section class="shop-panel bg-white border rounded-2xl p-6 lg:col-span-2">
                    <div class="flex items-center gap-3 mb-5">
                        <span class="w-10 h-10 rounded-xl bg-blue-100 text-blue-700 flex items-center justify-center"><i class="fa-solid fa-wallet"></i></span>
                        <div><h2 class="font-bold text-lg">Nạp trực tiếp vào ví</h2><p class="text-xs text-gray-500">Số dư mô phỏng được cộng ngay</p></div>
                    </div>
                    <form id="topupForm" class="space-y-4">
                        <div>
                            <label for="topupAmount" class="block text-sm font-semibold mb-1">Số tiền mô phỏng</label>
                            <input id="topupAmount" type="number" min="10000" step="10000" required class="w-full border rounded-lg px-3 py-2" placeholder="100000">
                        </div>
                        <div>
                            <label for="topupNote" class="block text-sm font-semibold mb-1">Ghi chú</label>
                            <textarea id="topupNote" rows="3" class="w-full border rounded-lg px-3 py-2" placeholder="Ví dụ: Nạp tiền mua hàng"></textarea>
                        </div>
                        <button class="w-full shop-action rounded-lg py-3 font-bold" type="submit"><i class="fa-solid fa-plus mr-2"></i>Nạp vào ví</button>
                    </form>
                    <p id="topupMessage" class="text-sm mt-4"></p>
                </section>

                <section class="shop-panel bg-white border rounded-2xl p-6 lg:col-span-3">
                    <div class="flex items-center justify-between gap-3 mb-5"><div><h2 class="font-bold text-lg">Lịch sử nạp ví</h2><p class="text-xs text-gray-500">Giao dịch mô phỏng của tài khoản</p></div><span class="text-xs bg-orange-50 text-orange-700 px-2.5 py-1 rounded-full font-bold">MÔ PHỎNG</span></div>
                    <div id="topupList" class="space-y-3"></div>
                </section>
            </div>
        </div>
    </main>
    <div id="footerContainer"></div>
    <script src="../js/data-store.js"></script>
    <script src="../js/navbar.js"></script>
    <script src="../js/wallet.js"></script>
</body>
</html>
