<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác nhận thanh toán - ShopDirect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="text-gray-800 flex flex-col min-h-screen">
    <div id="navbarContainer"></div>
    <main class="flex-1 container mx-auto px-4 py-8">
        <div class="max-w-2xl mx-auto">
            <p class="shop-section-label mb-1">ShopDirect Pay / mô phỏng</p>
            <h1 class="text-3xl font-bold mb-2">Xác nhận thanh toán</h1>
            <p class="text-sm text-gray-500 mb-6">Đây là màn hình mô phỏng, không kết nối ngân hàng và không thu tiền thật.</p>
            <section class="shop-panel bg-white border rounded-2xl p-6">
                <div id="paymentContent"></div>
                <p id="paymentMessage" class="text-sm mt-4"></p>
                <button id="confirmPayment" class="shop-action w-full rounded-lg py-3 mt-5 font-bold"><i class="fa-solid fa-check mr-2"></i>Xác nhận thanh toán mô phỏng</button>
                <a href="checkout.html" class="block text-center text-sm text-blue-700 font-semibold mt-4">Quay lại checkout</a>
            </section>
        </div>
    </main>
    <div id="footerContainer"></div>
    <script src="../js/data-store.js"></script><script src="../js/navbar.js"></script><script src="../js/payment.js"></script>
</body>
</html>
